<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />

  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <header class="navbar">
    <div class="nav-container">
      <a href="index.html" class="logo">Maryam Shahverdi</a>
      <button class="menu-toggle" id="menuToggle" aria-label="Toggle menu">&#9776;</button>
      <nav>
        <ul class="nav-links" id="navLinks">
          <li><a href="index.html">Home</a></li>
          <li><a href="about.html">About</a></li>
          <li><a href="projects.html">Projects</a></li>
          <li><a href="contact.html" class="active">Contact</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <main>
    <section class="page-header">
      <h1>Contact Me</h1>
    </section>

    <section class="contact-content">
      <p>Feel free to reach out — I'd love to hear from you.</p>

      <div class="contact-info">
        <a href="mailto:shahverdi.m516@gmail.com" class="contact-link">
          &#9993; shahverdi.m516@gmail.com
        </a>
        <a href="https://github.com/MaryamShahverdi" target="_blank" class="contact-link">
          &#128187; github.com/MaryamShahverdi
        </a>
      </div>

      <form class="contact-form" onsubmit="return false;">
        <label for="name">Name</label>
        <input type="text" id="name" name="name" required />

        <label for="email">Email</label>
        <input type="email" id="email" name="email" required />

        <label for="message">Message</label>
        <textarea id="message" name="message" rows="5" required></textarea>

        <button type="submit" class="btn btn-primary">Send Message</button>
      </form>
    </section>
  </main>

  <footer>

  <button id="scrollTopBtn" title="Scroll to top">&uarr;</button>

  <script src="js/script.js"></script>
</body>
